<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Query Engine — AI SQL Assistant</title>
    <meta name="description" content="Ask natural language analytics questions and get instant SQL-powered results.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/sql-formatter@15.8.2/dist/sql-formatter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        // Warm brown neutrals
                        ink: {
                            50: '#faf6f0', 100: '#f3ebdf', 200: '#e7dac7', 300: '#cdb89c', 400: '#a88e70',
                            500: '#86694d', 600: '#6b4f37', 700: '#543c29', 800: '#3f2c1e', 900: '#2b1d13',
                        },
                        accent: {
                            400: '#a8703f',
                            500: '#8b5a2b',
                            600: '#74461f',
                            700: '#5c3616',
                        },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-dot': 'pulseDot 1.4s infinite ease-in-out both',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pulseDot: { '0%, 80%, 100%': { transform: 'scale(0)' }, '40%': { transform: 'scale(1)' } },
                    },
                },
            },
        }
    </script>
    <style>
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cdb89c; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a88e70; }

        /* Titles */
        .instrument-serif-regular {
            font-family: "Instrument Serif", serif;
            font-weight: 400;
            font-style: normal;
        }
        .instrument-serif-regular-italic {
            font-family: "Instrument Serif", serif;
            font-weight: 400;
            font-style: italic;
        }

        /* Card */
        .glass {
            background: #fffdf9;
            border: 1px solid #e7dac7;
            box-shadow: 0 1px 2px rgba(63, 44, 30, 0.04), 0 8px 24px -12px rgba(63, 44, 30, 0.12);
        }

        /* Loading dots */
        .loading-dot { animation: pulseDot 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .loading-dot:nth-child(3) { animation-delay: 0s; }

        /* Table styling */
        .result-table { border-collapse: separate; border-spacing: 0; }
        .result-table th {
            background: #f3ebdf;
            color: #6b4f37;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #e7dac7;
        }
        .result-table td {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #f3ebdf;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #3f2c1e;
        }
        .result-table tr:last-child td { border-bottom: none; }
        .result-table tr:hover td { background: #faf6f0; }

        /* Code block */
        .sql-block {
            background: #f6efe4;
            border: 1px solid #e7dac7;
            border-radius: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #3f2c1e;
            padding: 1rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* SQL syntax colours */
        .sql-block { white-space: pre; word-break: normal; }
        .sql-block .hljs-keyword { color: #8b5a2b; font-weight: 600; }
        .sql-block .hljs-built_in,
        .sql-block .hljs-type { color: #6b7d2a; }
        .sql-block .hljs-string { color: #a4452c; }
        .sql-block .hljs-number,
        .sql-block .hljs-literal { color: #b0761d; }
        .sql-block .hljs-comment { color: #a88e70; font-style: italic; }
        .sql-block .hljs-operator { color: #86694d; }

        .section-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #a88e70;
        }

        .reasoning-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8em;
            background: #f3ebdf;
            color: #6b4f37;
            padding: 0.05em 0.35em;
            border-radius: 0.3em;
        }

        .suggestion-card { transition: all 0.2s ease; }
        .suggestion-card:hover {
            border-color: #cdb89c;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -14px rgba(63, 44, 30, 0.35);
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            background: #f5efe6;
            min-height: 100vh;
        }

        /* Pill composer */
        .composer {
            box-shadow: 0 1px 2px rgba(63, 44, 30, 0.04), 0 12px 32px -16px rgba(63, 44, 30, 0.25);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .composer:focus-within {
            border-color: #cdb89c;
            box-shadow: 0 0 0 4px rgba(139, 90, 43, 0.08), 0 12px 32px -16px rgba(63, 44, 30, 0.3);
        }

        /* Collapsible sections */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        /* Chip hover */
        .chip {
            transition: all 0.2s ease;
        }
        .chip:hover {
            background: #f3ebdf;
            border-color: #cdb89c;
            color: #3f2c1e;
            transform: translateY(-1px);
        }

        /* Feedback button */
        .feedback-btn {
            transition: all 0.2s ease;
        }
        .feedback-btn:hover { transform: scale(1.15); }
        .feedback-btn.active-positive { color: #4d7c0f; }
        .feedback-btn.active-negative { color: #b91c1c; }
    </style>
</head>
<body class="font-sans text-ink-800 antialiased">
    <div id="app" class="flex flex-col h-screen max-w-4xl mx-auto">

        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-5">
            <button type="button" onclick="location.reload()" class="flex items-center gap-3 cursor-pointer">
                <div class="w-9 h-9 rounded-full bg-accent-600 flex items-center justify-center shadow-sm">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 0-6.23.693L5 14.5m14.8.8 1.402 1.402c1.232 1.232.65 3.318-1.067 3.611l-.772.13A18.142 18.142 0 0 1 12 21a18.142 18.142 0 0 1-7.363-1.457l-.772-.13c-1.717-.293-2.3-2.379-1.067-3.61L5 14.5" />
                    </svg>
                </div>
                <h1 class="instrument-serif-regular text-2xl leading-none text-ink-900">Analytics Query Engine</h1>
            </button>
            <button type="button" onclick="location.reload()"
                    class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-medium text-ink-600 bg-white/70 border border-ink-200 hover:bg-white hover:text-ink-900 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                New chat
            </button>
        </header>

        <!-- Chat area -->
        <main id="chat-container" class="flex-1 min-w-0 overflow-y-auto overflow-x-hidden px-6 py-6 space-y-6">

            <!-- Welcome message -->
            <div id="welcome-message" class="flex flex-col items-center justify-center h-full text-center animate-fade-in">
                <div class="w-16 h-16 rounded-full bg-ink-100 border border-ink-200 flex items-center justify-center mb-6">
                    <svg class="w-8 h-8 text-accent-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 0 1 1.037-.443 48.282 48.282 0 0 0 5.68-.494c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
                    </svg>
                </div>
                <h2 class="instrument-serif-regular text-5xl text-ink-900 mb-3">Ask me anything about <span class="instrument-serif-regular-italic text-accent-600">your data</span></h2>
                <p class="text-sm text-ink-500 max-w-md mb-8">
                    I translate natural language questions into SQL queries and run them against your sales and targets datasets.
                </p>
                <div class="flex flex-wrap justify-center gap-2 mb-10 text-[0.7rem] text-ink-500">
                    <span class="px-3 py-1 rounded-full bg-white/60 border border-ink-200">10 orders</span>
                    <span class="px-3 py-1 rounded-full bg-white/60 border border-ink-200">3 regions · APAC, EMEA, NA</span>
                    <span class="px-3 py-1 rounded-full bg-white/60 border border-ink-200">Jan – Mar 2024</span>
                    <span class="px-3 py-1 rounded-full bg-white/60 border border-ink-200">Monthly targets</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl text-left" id="suggestions">
                    <!-- Populated by JS -->
                </div>
            </div>

        </main>

        <!-- Input area -->
        <footer class="px-6 pt-2 pb-6">
            <form id="query-form" class="composer flex items-center gap-2 p-2 pl-6 rounded-full bg-white border border-ink-200">
                <div class="flex-1 relative">
                    <input
                        type="text"
                        id="query-input"
                        class="w-full py-2 bg-transparent border-0 text-ink-900 placeholder-ink-400 text-[0.95rem] focus:outline-none"
                        placeholder="Ask a question about your data…"
                        autocomplete="off"
                        autofocus
                    >
                </div>
                <button
                    type="submit"
                    id="send-btn"
                    class="px-5 py-3 rounded-full bg-accent-600 text-ink-50 text-sm font-medium hover:bg-accent-700 focus:outline-none focus:ring-2 focus:ring-accent-500/30 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 shadow-sm"
                >
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                    </svg>
                    Send
                </button>
            </form>
        </footer>
    </div>

    <script>
    // -----------------------------------------------------------------------
    // State
    // -----------------------------------------------------------------------
    const chatContainer = document.getElementById('chat-container');
    const queryForm = document.getElementById('query-form');
    const queryInput = document.getElementById('query-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeMessage = document.getElementById('welcome-message');
    const suggestionsEl = document.getElementById('suggestions');

    const SUGGESTIONS = [
        { label: 'Totals', queries: ['Total sales in India for March', 'Average order value by region'] },
        { label: 'Rankings', queries: ['Top product in each region', 'Revenue of top 3 customers per region'] },
        { label: 'Targets', queries: ['Which region missed its target in Feb?', 'Q1 target attainment by region'] },
        { label: 'Mix & trends', queries: ['Sales contribution % by category', 'Month-over-month revenue growth'] },
    ];

    let isProcessing = false;

    // -----------------------------------------------------------------------
    // Initialize
    // -----------------------------------------------------------------------
    function init() {
        renderSuggestions();
        queryForm.addEventListener('submit', handleSubmit);
    }

    function renderSuggestions() {
        suggestionsEl.innerHTML = SUGGESTIONS.map(group => `
            <div class="suggestion-card rounded-3xl bg-white/70 border border-ink-200 p-4">
                <div class="section-label mb-2 px-1">${group.label}</div>
                <div class="flex flex-col gap-1">
                    ${group.queries.map(q => `
                        <button type="button" class="chip text-left px-3 py-2 rounded-xl text-[0.85rem] text-ink-700 border border-transparent cursor-pointer flex items-center justify-between gap-2"
                                onclick="submitQuery('${q.replace(/'/g, "\\'")}')">
                            <span>${q}</span>
                            <span class="text-ink-300">→</span>
                        </button>`).join('')}
                </div>
            </div>
        `).join('');
    }

    // -----------------------------------------------------------------------
    // Submit
    // -----------------------------------------------------------------------
    async function handleSubmit(e) {
        e.preventDefault();
        const query = queryInput.value.trim();
        if (!query || isProcessing) return;
        await submitQuery(query);
    }

    async function submitQuery(query) {
        if (isProcessing) return;
        isProcessing = true;
        sendBtn.disabled = true;
        queryInput.value = '';

        // Hide welcome
        if (welcomeMessage) {
            welcomeMessage.remove();
        }

        // Add user message
        appendMessage('user', query);

        // Add loading indicator
        const loadingEl = appendLoading();

        try {
            const res = await fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query }),
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
                throw new Error(err.detail || `HTTP ${res.status}`);
            }

            const data = await res.json();
            loadingEl.remove();
            appendAIResponse(data);
        } catch (err) {
            loadingEl.remove();
            appendMessage('error', `Error: ${err.message}`);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            queryInput.focus();
        }
    }

    // -----------------------------------------------------------------------
    // Message rendering
    // -----------------------------------------------------------------------
    function appendMessage(type, content) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${type === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up`;

        const bubble = document.createElement('div');

        if (type === 'user') {
            bubble.className = 'max-w-[80%] px-5 py-3 rounded-[1.75rem] bg-accent-600 text-ink-50 text-[0.95rem] shadow-sm';
            bubble.textContent = content;
        } else if (type === 'error') {
            bubble.className = 'max-w-[80%] px-5 py-3 rounded-[1.75rem] glass text-red-700 text-sm';
            bubble.textContent = content;
        }

        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        scrollToBottom();
    }

    function appendLoading() {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex justify-start animate-slide-up';
        wrapper.id = 'loading-indicator';

        wrapper.innerHTML = `
            <div class="glass px-5 py-3 rounded-full flex items-center gap-2">
                <div class="flex gap-1">
                    <span class="loading-dot w-2 h-2 rounded-full bg-accent-400"></span>
                    <span class="loading-dot w-2 h-2 rounded-full bg-accent-400"></span>
                    <span class="loading-dot w-2 h-2 rounded-full bg-accent-400"></span>
                </div>
                <span class="text-xs text-ink-500 ml-1">Analyzing…</span>
            </div>
        `;

        chatContainer.appendChild(wrapper);
        scrollToBottom();
        return wrapper;
    }

    function appendAIResponse(data) {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex justify-start min-w-0 animate-slide-up';

        const bubble = document.createElement('div');
        bubble.className = 'w-full max-w-[92%] min-w-0 glass rounded-[1.75rem] overflow-hidden';

        // Confidence badge
        const conf = data.confidence_score;
        let badgeColor, badgeLabel;
        if (conf >= 0.8) {
            badgeColor = 'bg-[#eef0e2] text-[#4d6b1f] border-[#d5dcb8]';
            badgeLabel = 'High confidence';
        } else if (conf >= 0.5) {
            badgeColor = 'bg-amber-50 text-amber-800 border-amber-200';
            badgeLabel = 'Medium confidence';
        } else {
            badgeColor = 'bg-red-50 text-red-700 border-red-200';
            badgeLabel = 'Low confidence';
        }

        // Build HTML
        let html = `
            <div class="px-6 pt-5 pb-5">
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <span class="instrument-serif-regular text-2xl text-ink-900 mr-auto leading-none">Answer</span>
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-[0.7rem] font-medium border ${badgeColor}">
                        ${badgeLabel} · ${(conf * 100).toFixed(0)}%
                    </span>
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[0.7rem] font-medium bg-ink-50 text-ink-500 border border-ink-200" title="Response time">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>
                        ${formatDuration(data.response_time_ms)}
                    </span>
                    ${data.cache_hit ? `
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[0.7rem] font-medium bg-accent-600/10 text-accent-700 border border-accent-600/20" title="Served from a previous identical query">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
                        </svg>
                        Cached
                    </span>` : ''}
                    ${!data.cache_hit && data.attempts > 1 ? `<span class="text-[0.7rem] text-ink-400">${data.attempts} attempts</span>` : ''}
                </div>
                <p class="text-[0.95rem] text-ink-800 leading-relaxed">${escapeHtml(data.explanation)}</p>
            </div>
        `;

        // Result: table or scalar
        const result = data.result;
        if (Array.isArray(result) && result.length > 0) {
            html += `
                <div class="px-6 pt-4 flex items-baseline justify-between border-t border-ink-100">
                    <span class="section-label">Result</span>
                    <span class="text-[0.7rem] text-ink-400">${result.length} row${result.length === 1 ? '' : 's'}</span>
                </div>`;
            html += renderTable(result);
        } else if (typeof result === 'string' && result !== 'No results found.') {
            html += `
                <div class="px-6 py-4 border-t border-ink-100">
                    <span class="section-label">Result</span>
                    <p class="instrument-serif-regular text-5xl text-ink-900 mt-1 leading-tight">${escapeHtml(formatScalar(result))}</p>
                </div>
            `;
        } else if (result === 'No results found.') {
            html += `
                <div class="px-5 py-3 border-t border-ink-100">
                    <p class="text-sm text-ink-500 italic">No results found.</p>
                </div>
            `;
        }

        // SQL (formatted + highlighted)
        const sqlId = `sql-${Date.now()}`;
        html += `
            <details class="border-t border-ink-100" open>
                <summary class="px-6 py-3 cursor-pointer select-none flex items-center justify-between">
                    <span class="section-label flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
                        </svg>
                        Generated SQL
                    </span>
                    <button type="button" class="px-3 py-1 rounded-full text-[0.7rem] text-ink-500 border border-ink-200 hover:bg-ink-50 hover:text-ink-800 transition-colors"
                            onclick="event.preventDefault(); copySql('${sqlId}', this)">Copy</button>
                </summary>
                <div class="px-5 pb-4">
                    <pre class="sql-block" id="${sqlId}">${renderSql(data.generated_sql)}</pre>
                </div>
            </details>
        `;

        // Logic collapsible
        if (data.generated_logic) {
            html += `
                <details class="border-t border-ink-100">
                    <summary class="section-label px-6 py-3 cursor-pointer hover:text-ink-700 transition-colors select-none flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
                        </svg>
                        Reasoning
                    </summary>
                    <div class="px-6 pb-4">
                        ${renderReasoning(data.generated_logic)}
                    </div>
                </details>
            `;
        }

        // Feedback buttons
        const responseId = `resp-${Date.now()}`;
        html += `
            <div class="flex items-center gap-1 px-5 py-2.5 border-t border-ink-100" id="${responseId}">
                <span class="text-[0.65rem] text-ink-400 mr-2 feedback-status">Was this helpful?</span>
                <button class="feedback-btn p-2 rounded-full hover:bg-ink-100 text-ink-400" title="Helpful"
                        onclick="sendFeedback('${responseId}', '${escapeAttr(data.query)}', '${escapeAttr(data.generated_sql)}', 'positive', this)">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

                    </svg>
                </button>
                <button class="feedback-btn p-2 rounded-full hover:bg-ink-100 text-ink-400" title="Not helpful"
                        onclick="sendFeedback('${responseId}', '${escapeAttr(data.query)}', '${escapeAttr(data.generated_sql)}', 'negative', this)">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.498 15.25H4.372c-1.026 0-1.945-.694-2.054-1.715a12.137 12.137 0 0 1-.068-1.285c0-2.848.992-5.464 2.649-7.521C5.287 4.247 5.886 4 6.504 4h4.016a4.5 4.5 0 0 1 1.423.23l3.114 1.04a4.5 4.5 0 0 0 1.423.23h1.294M7.498 15.25c.618 0 .991.724.725 1.282A7.471 7.471 0 0 0 7.5 19.75 2.25 2.25 0 0 0 9.75 22a.75.75 0 0 0 .75-.75v-.633c0-.573.11-1.14.322-1.672.304-.76.93-1.33 1.653-1.715a9.04 9.04 0 0 0 2.86-2.4c.498-.634 1.226-1.08 2.032-1.08h.384m-10.253 1.5H9.7m8.075-9.75c.01.05.027.1.05.148.593 1.2.925 2.55.925 3.977 0 1.487-.36 2.89-.999 4.125m.023-8.25c-.076-.365.183-.75.575-.75h.908c.889 0 1.713.518 1.972 1.368.339 1.11.521 2.287.521 3.507 0 1.553-.295 3.036-.831 4.398-.306.774-1.086 1.227-1.918 1.227h-1.053c-.472 0-.745-.556-.5-.96a8.95 8.95 0 0 0 .303-.54" />

        bubble.innerHTML = html;
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        scrollToBottom();
    }

    // -----------------------------------------------------------------------
    // Table renderer
    // -----------------------------------------------------------------------
    function renderTable(rows) {
        if (!rows.length) return '';
        const keys = Object.keys(rows[0]);

        let html = `
            <div class="px-5 pt-2 pb-4 overflow-x-auto">
                <div class="rounded-2xl border border-ink-200 overflow-hidden"><table class="result-table w-full text-left">
                    <thead><tr>
        `;
        keys.forEach(k => {
            html += `<th>${escapeHtml(k)}</th>`;
        });
        html += `</tr></thead><tbody>`;

        rows.forEach(row => {
            html += '<tr>';
            keys.forEach(k => {
                const val = row[k];
                const formatted = formatValue(val);
                html += `<td>${formatted}</td>`;
            });
            html += '</tr>';
        });

        html += '</tbody></table></div></div>';
        return html;
    }

    function formatValue(val) {
        if (val === null || val === undefined) return '<span class="text-ink-300">NULL</span>';
        if (typeof val === 'number') {
            // Format numbers nicely
            if (Number.isInteger(val)) return val.toLocaleString();
            return val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return escapeHtml(String(val));
    }

    // -----------------------------------------------------------------------
    // Feedback
    // -----------------------------------------------------------------------
    async function sendFeedback(responseId, query, sql, feedback, btnEl) {
        const container = document.getElementById(responseId);
        if (!container) return;
        const statusEl = container.querySelector('.feedback-status');

        // Visual feedback
        const allBtns = container.querySelectorAll('.feedback-btn');
        allBtns.forEach(b => {
            b.classList.remove('active-positive', 'active-negative');
            b.disabled = true;
        });
        btnEl.classList.add(feedback === 'positive' ? 'active-positive' : 'active-negative');
        if (statusEl) statusEl.textContent = 'Saving…';

        try {
            const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, generated_sql: sql, feedback }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            if (statusEl) statusEl.textContent = 'Thanks, feedback saved ✓';
        } catch (err) {
            console.error('Feedback error:', err);
            if (statusEl) statusEl.textContent = 'Could not save feedback — try again';
            allBtns.forEach(b => { b.disabled = false; });
            btnEl.classList.remove('active-positive', 'active-negative');
        }
    }

    // -----------------------------------------------------------------------
    // Utilities
    // -----------------------------------------------------------------------
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function renderReasoning(text) {
        if (!text) return '';

        // Split "1. ... 2. ... 3. ..." into individual numbered steps.
        // Model output is one paragraph with inline "N. " markers, not real newlines.
        // Only treat "N." as a step boundary when N is the next expected integer —
        // otherwise numbers inside the reasoning itself (e.g. "* 100.") get misread as steps.
        const marker = /(?:^|\s)(\d+)\.\s+/g;
        const boundaries = [];
        let m, next = 1;
        while ((m = marker.exec(text)) !== null) {
            if (Number(m[1]) === next) {
                boundaries.push({ index: m.index, matchEnd: m.index + m[0].length });
                next += 1;
            }
        }
        const steps = boundaries.map((b, i) => {
            const end = i + 1 < boundaries.length ? boundaries[i + 1].index : text.length;
            return text.slice(b.matchEnd, end).trim();
        });

        const highlight = s => escapeHtml(s).replace(
            /\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\b/g,
            m => `<code class="reasoning-code">${m}</code>`
        );

        if (steps.length < 2) {
            return `<p class="text-sm text-ink-600 leading-relaxed">${highlight(text)}</p>`;
        }

        return `
            <ol class="text-sm text-ink-600 leading-relaxed space-y-2 list-none">
                ${steps.map((step, i) => `
                    <li class="flex gap-3">
                        <span class="flex-none w-5 h-5 rounded-full bg-ink-100 text-ink-500 text-[0.7rem] font-medium flex items-center justify-center mt-0.5">${i + 1}</span>
                        <span>${highlight(step)}</span>
                    </li>
                `).join('')}
            </ol>
        `;
    }

    function renderSql(sql) {
        let pretty = sql || '';
        try {
            if (window.sqlFormatter) {
                pretty = sqlFormatter.format(pretty, { language: 'duckdb', keywordCase: 'upper', tabWidth: 2 });
            }
        } catch (e) {
            console.warn('SQL formatting failed, showing raw SQL:', e);
        }
        if (window.hljs) {
            return hljs.highlight(pretty, { language: 'sql' }).value;
        }
        return escapeHtml(pretty);
    }

    async function copySql(id, btn) {
        const text = document.getElementById(id)?.innerText || '';
        try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        } catch (e) { console.error(e); }
    }

    function formatScalar(val) {
        const n = Number(val);
        if (val !== '' && Number.isFinite(n)) {
            return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }
        return val;
    }

    function formatDuration(ms) {
        if (ms === undefined || ms === null) return '—';
        if (ms < 1000) return `${ms} ms`;
        return `${(ms / 1000).toFixed(2)} s`;
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    }

    // -----------------------------------------------------------------------
    // Boot
    // -----------------------------------------------------------------------
    init();
    </script>
