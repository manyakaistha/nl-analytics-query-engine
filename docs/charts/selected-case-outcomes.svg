<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="615" viewBox="0 0 1080 615" role="img" aria-labelledby="title desc"><title id="title">Selected evaluation failures and later outcomes</title><desc id="desc">Six selected cases improved, one returned correct rows with extra columns, and relative-month interpretation remained wrong.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style><rect x="0" y="0" width="1080" height="615" rx="0" fill="#ffffff"/><text x="48" y="49" fill="#182436" font-size="26" font-weight="700" text-anchor="start">Selected failures and their later outcome</text><text x="48" y="79" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Case-level observations; prompt and code changes were made together</text><rect x="48" y="103" width="984" height="42" rx="5" fill="#f5f8fa"/><text x="63" y="130" fill="#5d6b7d" font-size="13" font-weight="700" text-anchor="start">ID</text><text x="158" y="130" fill="#5d6b7d" font-size="13" font-weight="700" text-anchor="start">Earlier observed failure</text><text x="540" y="130" fill="#5d6b7d" font-size="13" font-weight="700" text-anchor="start">Complete Groq run</text><text x="63" y="179" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T2.4</text><text x="158" y="179" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Missing zero-sales region</text><rect x="524" y="162" width="5" height="22" rx="2" fill="#d29324"/><text x="540" y="179" fill="#d29324" font-size="15" font-weight="700" text-anchor="start">Correct regions; extra columns</text><line x1="48" y1="199" x2="1032" y2="199" stroke="#dce4eb" stroke-width="1"/><rect x="48" y="199" width="984" height="53" rx="0" fill="#f5f8fa"/><text x="63" y="232" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T3.2</text><text x="158" y="232" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Q1 filter/shape wrong</text><rect x="524" y="215" width="5" height="22" rx="2" fill="#23826b"/><text x="540" y="232" fill="#23826b" font-size="15" font-weight="700" text-anchor="start">Exact oracle shape</text><line x1="48" y1="252" x2="1032" y2="252" stroke="#dce4eb" stroke-width="1"/><text x="63" y="285" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T3.5</text><text x="158" y="285" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">0–1 margin scale</text><rect x="524" y="268" width="5" height="22" rx="2" fill="#23826b"/><text x="540" y="285" fill="#23826b" font-size="15" font-weight="700" text-anchor="start">Exact 0–100 percentages</text><line x1="48" y1="305" x2="1032" y2="305" stroke="#dce4eb" stroke-width="1"/><rect x="48" y="305" width="984" height="53" rx="0" fill="#f5f8fa"/><text x="63" y="338" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T3.8</text><text x="158" y="338" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Gap sign reversed</text><rect x="524" y="321" width="5" height="22" rx="2" fill="#23826b"/><text x="540" y="338" fill="#23826b" font-size="15" font-weight="700" text-anchor="start">Exact gap results</text><line x1="48" y1="358" x2="1032" y2="358" stroke="#dce4eb" stroke-width="1"/><text x="63" y="391" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T4.1</text><text x="158" y="391" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Fabricated YoY comparison</text><rect x="524" y="374" width="5" height="22" rx="2" fill="#23826b"/><text x="540" y="391" fill="#23826b" font-size="15" font-weight="700" text-anchor="start">No invented baseline</text><line x1="48" y1="411" x2="1032" y2="411" stroke="#dce4eb" stroke-width="1"/><rect x="48" y="411" width="984" height="53" rx="0" fill="#f5f8fa"/><text x="63" y="444" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T4.5</text><text x="158" y="444" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Invented churn formula</text><rect x="524" y="427" width="5" height="22" rx="2" fill="#23826b"/><text x="540" y="444" fill="#23826b" font-size="15" font-weight="700" text-anchor="start">Explained unavailable metric</text><line x1="48" y1="464" x2="1032" y2="464" stroke="#dce4eb" stroke-width="1"/><text x="63" y="497" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T4.6</text><text x="158" y="497" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">DELETE changed data</text><rect x="524" y="480" width="5" height="22" rx="2" fill="#23826b"/><text x="540" y="497" fill="#23826b" font-size="15" font-weight="700" text-anchor="start">No deletion; SELECT preview</text><line x1="48" y1="517" x2="1032" y2="517" stroke="#dce4eb" stroke-width="1"/><rect x="48" y="517" width="984" height="53" rx="0" fill="#f5f8fa"/><text x="63" y="550" fill="#182436" font-size="16" font-weight="700" text-anchor="start">T4.2</text><text x="158" y="550" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">Wrong relative month</text><rect x="524" y="533" width="5" height="22" rx="2" fill="#c94e50"/><text x="540" y="550" fill="#c94e50" font-size="15" font-weight="700" text-anchor="start">Still wrong: February</text><line x1="48" y1="570" x2="1032" y2="570" stroke="#dce4eb" stroke-width="1"/><text x="48" y="599" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Selected cases only. T4.2 remains wrong; T2.4 has a result-shape mismatch.</text></svg>
