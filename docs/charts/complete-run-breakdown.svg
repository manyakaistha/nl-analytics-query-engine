<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">Complete Groq evaluation result breakdown</title><desc id="desc">30 of 30 executed; 15 of 17 exact oracle matches; 11 of 13 behavior cases passed manual review, 1 partial, 1 failed.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style><rect x="0" y="0" width="1080" height="440" rx="0" fill="#ffffff"/><text x="48" y="49" fill="#182436" font-size="26" font-weight="700" text-anchor="start">Complete Groq run: 30 questions</text><text x="48" y="79" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">GPT OSS 120B • one run per case • 30/30 executed on the first attempt</text><text x="48" y="140" fill="#182436" font-size="18" font-weight="700" text-anchor="start">SQL-oracle cases</text><text x="48" y="165" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Exact output shape vs a different column shape</text><text x="48" y="240" fill="#182436" font-size="18" font-weight="700" text-anchor="start">Behavior cases</text><text x="48" y="265" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Manual review against expected behavior</text><rect x="340" y="123" width="529" height="42" rx="5" fill="#23826b"/><rect x="869" y="123" width="71" height="42" rx="5" fill="#d29324"/><text x="960" y="152" fill="#182436" font-size="17" font-weight="700" text-anchor="start">15/17 exact</text><rect x="340" y="223" width="508" height="42" rx="5" fill="#23826b"/><rect x="848" y="223" width="46" height="42" rx="5" fill="#d29324"/><rect x="894" y="223" width="46" height="42" rx="5" fill="#c94e50"/><text x="960" y="252" fill="#182436" font-size="17" font-weight="700" text-anchor="start">11/13 pass</text><rect x="48" y="307" width="15" height="15" rx="2" fill="#23826b"/><text x="73" y="320" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Exact / pass</text><rect x="222" y="307" width="15" height="15" rx="2" fill="#d29324"/><text x="247" y="320" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Shape difference / partial</text><rect x="488" y="307" width="15" height="15" rx="2" fill="#c94e50"/><text x="513" y="320" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Fail</text><line x1="48" y1="346" x2="1030" y2="346" stroke="#dce4eb" stroke-width="1"/><text x="48" y="375" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">30/30 SQL executions succeeded. The 2 oracle differences were output-shape differences.</text><text x="48" y="399" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Tier 4: T4.2 failed; T4.11 was partial. The Gemini judge was unavailable (quota).</text></svg>
