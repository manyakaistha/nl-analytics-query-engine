<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1050" viewBox="0 0 1080 1050" role="img" aria-labelledby="title desc"><title id="title">All oracle questions compared across saved evaluation stages</title><desc id="desc">Using the corrected scorer: R0 had 5 of 8 exact; early R1 had 10 of 17 exact; the complete run had 15 of 17 exact. Stage settings differ.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style><rect x="0" y="0" width="1080" height="1050" rx="0" fill="#ffffff"/><text x="48" y="48" fill="#182436" font-size="26" font-weight="700" text-anchor="start">Every oracle case, rescored consistently</text><text x="48" y="78" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">The same corrected result comparator was applied to each saved response</text><text x="48" y="132" fill="#5d6b7d" font-size="14" font-weight="700" text-anchor="start">Question</text><text x="554" y="132" fill="#182436" font-size="15" font-weight="700" text-anchor="middle">R0</text><text x="754" y="132" fill="#182436" font-size="15" font-weight="700" text-anchor="middle">Early R1</text><text x="954" y="132" fill="#182436" font-size="15" font-weight="700" text-anchor="middle">Complete</text><text x="48" y="163" fill="#182436" font-size="17" font-weight="700" text-anchor="start">R0: 5/8 exact  •  Early R1: 10/17 exact  •  Complete: 15/17 exact</text><rect x="48" y="181" width="984" height="37" rx="4" fill="#f5f8fa"/><text x="62" y="205" fill="#182436" font-size="14" font-weight="700" text-anchor="start">T1.1</text><text x="123" y="205" fill="#182436" font-size="14" font-weight="400" text-anchor="start">Total sales</text><rect x="474" y="185" width="160" height="29" rx="5" fill="#23826b"/><text x="554" y="205" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">45</text><rect x="674" y="185" width="160" height="29" rx="5" fill="#23826b"/><text x="754" y="205" fill="#ffffff" font-size