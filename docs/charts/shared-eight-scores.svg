<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="670" viewBox="0 0 1080 670" role="img" aria-labelledby="title desc"><title id="title">Recorded R0 and early R1 scores for the same eight questions</title><desc id="desc">R0 mean 66.0 out of 100; early R1 mean 82.1. Old scoring limitations apply.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style><rect x="0" y="0" width="1080" height="670" rx="0" fill="#ffffff"/><text x="48" y="48" fill="#182436" font-size="26" font-weight="700" text-anchor="start">Same eight questions: recorded score by stage</text><text x="48" y="77" fill="#5d6b7d" font-size="15" font-weight="400" text-anchor="start">R0 baseline vs early R1 prompt tune • original 100-point harness</text><rect x="48" y="97" width="245" height="50" rx="10" fill="#f5f8fa"/><text x="63" y="129" fill="#087f8c" font-size="21" font-weight="700" text-anchor="start">R0 mean 66.0</text><rect x="304" y="97" width="245" height="50" rx="10" fill="#f5f8fa"/><text x="319" y="129" fill="#7056a8" font-size="21" font-weight="700" text-anchor="start">R1 mean 82.1</text><rect x="670" y="108" width="16" height="16" rx="3" fill="#087f8c"/><text x="694" y="122" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">R0</text><rect x="748" y="108" width="16" height="16" rx="3" fill="#7056a8"/><text x="772" y="122" fill="#5d6b7d" font-size="14" font-weight="400" text-anchor="start">Early R1</text><line x1="198" y1="168" x2="198" y2="567" stroke="#dce4eb" stroke-width="1"/><text x="198" y="586" fill="#5d6b7d" font-size="12" font-weight="400" text-anchor="middle">0</text><line x1="380" y1="168" x2="380" y2="567" stroke="#dce4eb" stroke-width="1"/><text x="380" y="586" fill="#5d6b7d" font-size="12" font-weight="400" text-anchor="middle">25</text><line x1="563" y1="168" x2="563" y2="567" stroke="#dce4eb" stroke-width="1"/><text x="563" y="586" fill="#5d6b7d" font-size="12" font-weight="400" text-ancho