[project]
name = "sql-interview-tool"
version = "0.1.0"
description = "Intelligent Analytics Query Engine — NL to SQL via Groq + DuckDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.1.0",
    "groq>=0.11.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "anthropic>=1.8.0",
    "pyyaml>=6.0.3",
    "google-genai>=2.25.0",
]

[project.scripts]
preprocess = "scripts.preprocess:main"
